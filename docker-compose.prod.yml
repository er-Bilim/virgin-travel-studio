services:
  mongo:
    image: mongo:7
    container_name: virgin-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: virgin-travel
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username", "${MONGO_ROOT_USER}",
          "--password", "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase", "admin",
          "--eval", "db.adminCommand('ping')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: virgin-backend:prod
    container_name: virgin-backend
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_IMAGE_URL: ${NEXT_IMAGE_URL:-http://localhost}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_BACK_URL: ${NEXT_BACK_URL:-http://backend:8000}
        NEXT_API_URL: ${NEXT_API_URL:-http://backend:8000/api}
    image: virgin-frontend:prod
    container_name: virgin-frontend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_API_URL=${NEXT_API_URL:-http://backend:8000/api}
      - NEXT_BACK_URL=${NEXT_BACK_URL:-http://backend:8000}
      - NEXT_IMAGE_URL=${NEXT_IMAGE_URL:-http://localhost}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
      - NEXT_WHATSAPP_PHONE=${NEXT_WHATSAPP_PHONE:-}
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: virgin-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  # ── Certbot (Let's Encrypt) ──────────────────────────────────────────────────
  # Uncomment to issue / renew SSL certificates:
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: virgin-certbot
  #   volumes:
  #     - ./nginx/certbot/conf:/etc/letsencrypt
  #     - ./nginx/certbot/www:/var/www/certbot
  #   entrypoint: >
  #     /bin/sh -c "trap exit TERM;
  #     while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
